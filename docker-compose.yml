services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: portfolio, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: portfolio }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U portfolio"], interval: 5s, timeout: 5s, retries: 10 }
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio
      UPLOAD_DIR: /app/uploads
    ports: ["3000:3000"]
    volumes: [uploads:/app/uploads]
    depends_on: { db: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:3000/robots.txt"], interval: 30s, timeout: 5s, retries: 5, start_period: 40s }
  caddy:
    image: caddy:2
    profiles: ["prod"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", caddydata:/data]
    depends_on: [app]
volumes: { dbdata: {}, uploads: {}, caddydata: {} }
